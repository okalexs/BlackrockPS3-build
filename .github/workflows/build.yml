
name: Build Blackrock PS3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Extract source and compile
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath "BlackrockPS3-connection-fixed-BUILD-PACKAGE.zip" -DestinationPath "." -Force
          & "./BlackrockPS3-source/BUILD_AND_PACKAGE.ps1"

      - name: Downloadable EXE package
        uses: actions/upload-artifact@v4
        with:
          name: BlackrockPS3-win64
          path: BlackrockPS3-source/dist/BlackrockPS3-connection-fixed-win64.zip
          if-no-files-found: error
